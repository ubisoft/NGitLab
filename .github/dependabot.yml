# See documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
      time: "05:00"
      timezone: "America/Montreal"
    rebase-strategy: auto
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # NGitLab.PublicApi.Tests is handled by its own entry below (it pins some packages with VersionOverride)
  - package-ecosystem: "nuget"
    directories:
      - "/NGitLab"
      - "/NGitLab.Mock"
      - "/NGitLab.Mock.Tests"
      - "/NGitLab.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Montreal"
    ignore:
      # Don't bump these to 9.x.y, as those versions may not be totally compatible with .NET 6 or 8
      - dependency-name: "Microsoft.AspNetCore.WebUtilities"
        versions: [">= 9.0.0"]
      - dependency-name: "Microsoft.Bcl.AsyncInterfaces"
        versions: [">= 9.0.0"]
      - dependency-name: "System.Text.Json"
        versions: [">= 9.0.0"]
      # LibGit2Sharp 0.31.0+ no longer targets net6.0
      - dependency-name: "LibGit2Sharp"
        versions: [">= 0.31.0"]
      # Higher versions do not seem to provide a definition for 'System.Runtime.CompilerServices.IsExternalInit'
      - dependency-name: "PolySharp"
        versions: [">= 1.16.0"]
      # Verify 33.0.0+ requires sponsorship
      - dependency-name: "Verify.NUnit"
        versions: [">= 33.0.0"]
    rebase-strategy: auto
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Groups are matched top-down: the first group whose patterns match (and
      # exclude-patterns don't) wins, so ordering below is significant, e.g.
      # NUnit.Analyzers matches "*Analyzer*" here before test-dependencies is
      # ever considered.
      code-analyzers:
        patterns:
          - "*Analyzer*"
      ms-dependencies:
        patterns:
          - "Microsoft.*"
          - "System.*"
        exclude-patterns:
          - "*Analyzer*"
          - "Microsoft.NET.Test.Sdk"
      test-dependencies:
        patterns:
          - "coverlet.collector"
          - "Microsoft.NET.Test.Sdk"
          - "NSubstitute"
          - "*NUnit*"
        exclude-patterns:
          - "NUnit.Analyzers"
      misc-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "*Analyzer*"
          - "Microsoft.*"
          - "System.*"
          - "coverlet.collector"
          - "Microsoft.NET.Test.Sdk"
          - "NSubstitute"
          - "*NUnit*"

  # NGitLab.PublicApi.Tests pins Microsoft.NET.Test.Sdk, NUnit and NUnit3TestAdapter with VersionOverride on purpose.
  # Dependabot's "ignore" can't be scoped to a single file, so this project is excluded from the entry above and
  # handled here instead, with an allow-list so that only packages used solely by this project are updated.
  # Every other package it references is also referenced by a project covered by the entry above, and those
  # updates change the shared Directory.Packages.props, so they must not be proposed twice.
  - package-ecosystem: "nuget"
    directory: "/NGitLab.PublicApi.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Montreal"
    allow:
      - dependency-name: "PublicApiGenerator"
    rebase-strategy: auto
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
